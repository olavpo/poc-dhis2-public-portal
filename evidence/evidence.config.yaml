appearance:
  default: system
  switcher: true

theme:
  colorPalettes:
    # Apache Superset default categorical palette (cyan-led).
    default:
      light:
        - "#1FA8C9"
        - "#454E7C"
        - "#5AC189"
        - "#FF7F44"
        - "#E04355"
        - "#FCC700"
        - "#A868B7"
        - "#3CCCCB"
        - "#A38F79"
        - "#8FD3E4"
      dark:
        - "#1FA8C9"
        - "#454E7C"
        - "#5AC189"
        - "#FF7F44"
        - "#E04355"
        - "#FCC700"
        - "#A868B7"
        - "#3CCCCB"
        - "#A38F79"
        - "#8FD3E4"
  colorScales:
    # Superset-ish sequential cyan for choropleths.
    default:
      light:
        - "#E6F4F8"
        - "#176F87"
      dark:
        - "#E6F4F8"
        - "#176F87"
  colors:
    primary:
      light: "#1FA8C9"
      dark: "#1FA8C9"
    accent:
      light: "#c2410c"
      dark: "#fdba74"
    base:
      light: "#ffffff"
      dark: "#09090b"
    info:
      light: "#0284c7"
      dark: "#38bdf8"
    positive:
      light: "#16a34a"
      dark: "#4ade80"
    warning:
      light: "#f8c900"
      dark: "#fbbf24"
    negative:
      light: "#dc2626"
      dark: "#f87171"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    # You can add additional datasources here by adding npm packages. 
    # Make to also add them to `package.json`.
    "@evidence-dev/csv": { }
    "@evidence-dev/duckdb": { }
