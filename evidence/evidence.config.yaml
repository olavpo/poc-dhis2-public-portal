# Served under /portal on the shared proxy. This base path is baked into Evidence's own
# links/assets at build, and into the generated ASC page URLs (see scripts/asc-pages/) which
# read this value — keep them in sync. Empty/remove to serve from a host root.
deployment:
  basePath: /portal

appearance:
  default: system
  switcher: true

theme:
  colorPalettes:
    # Nigeria-green-anchored categorical palette (matches the DNEMIS chrome).
    default:
      light:
        - "#1a9c5b"
        - "#f4a261"
        - "#2a6f97"
        - "#e76f51"
        - "#8a5a83"
        - "#e9c46a"
        - "#0e7c4a"
        - "#7fc99b"
      dark:
        - "#1a9c5b"
        - "#f4a261"
        - "#2a6f97"
        - "#e76f51"
        - "#8a5a83"
        - "#e9c46a"
        - "#0e7c4a"
        - "#7fc99b"
  colorScales:
    # Green sequential scale for choropleths.
    default:
      light:
        - "#e6f4ec"
        - "#0a3d2c"
      dark:
        - "#e6f4ec"
        - "#0a3d2c"
  colors:
    primary:
      light: "#1a9c5b"
      dark: "#1a9c5b"
    accent:
      light: "#c2410c"
      dark: "#fdba74"
    base:
      light: "#ffffff"
      dark: "#09090b"
    info:
      light: "#0284c7"
      dark: "#38bdf8"
    positive:
      light: "#16a34a"
      dark: "#4ade80"
    warning:
      light: "#f8c900"
      dark: "#fbbf24"
    negative:
      light: "#dc2626"
      dark: "#f87171"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    # You can add additional datasources here by adding npm packages. 
    # Make to also add them to `package.json`.
    "@evidence-dev/csv": { }
    "@evidence-dev/duckdb": { }
